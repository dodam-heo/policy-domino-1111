name: Policy Domino Unified - Single Production Pipeline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/unified.yml'
      - 'unified/**'
      - 'tests/**'
      - 'site/index.html'
      - 'site/app.js'
      - 'site/style.css'
      - 'site/presentation.js'
      - 'site/view-model.js'
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  ui:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ui-only]')
    runs-on: ubuntu-latest
    concurrency:
      group: policy-domino-ui-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify frontend syntax and current data
        run: |
          node --check site/app.js
          node --check site/view-model.js
          node --check site/presentation.js
          node tests/test_ui_identity.cjs
          python -c "import json; d=json.load(open('site/data.json')); assert d['events']"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[ui-only]')
    concurrency:
      group: policy-domino-unified-single-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out ONE canonical source and data store
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install annex PDF text extraction
        run: python -m pip install --disable-pip-version-check 'pypdf>=5,<7'
      - name: Verify audited source and evidence gates
        run: |
          python -m unittest discover -s tests -v
          node tests/test_ui_identity.cjs
      - name: Refresh official public-institution directory
        if: github.event_name != 'pull_request'
        run: python -m unified.institutions --root data
      - name: Collect independent official change versions
        if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[deploy-existing]')
        env:
          LAW_OC: ${{ vars.LAW_OC || 'dori' }}
          PD_FETCH_OFFICIAL_ATTACHMENTS: 'true'
          PD_COLLECTION_SECONDS: '600'
        run: python -m unified.engine --root data --streams 6 --details 60
      - name: Incrementally refresh official Gov24 program criteria if configured
        if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[deploy-existing]')
        env:
          GOV24_SERVICE_KEY: ${{ secrets.GOV24_SERVICE_KEY }}
        run: python -m unified.gov24 --root data --list-pages 3 --detail-pages 3
      - name: Identify verified public-agency program impacts
        if: github.event_name != 'pull_request'
        env:
          PD_LLM_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.PD_LLM_API_KEY || secrets.OPENAI_API_KEY }}
          PD_LLM_MODEL: ${{ vars.PD_LLM_MODEL || 'gemini-3.5-flash-lite' }}
          PD_LLM_URL: ${{ vars.PD_LLM_URL || 'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions' }}
          PD_LLM_MAX_REQUESTS: ${{ vars.PD_LLM_MAX_REQUESTS || '60' }}
        run: python -m unified.impact --root data
      - name: Build compact source-backed policy workbench
        run: python -m unified.publish --root data --output site/data.json
      - name: Check final publication contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          catalog=json.loads(Path('site/data.json').read_text('utf8'))
          assert catalog['schema']=='policy-domino-unified-ui-v1'
          assert catalog['events']
          ids=[e['id'] for e in catalog['events']]
          assert len(ids)==len(set(ids))
          for item in catalog['events']:
              assert item.get('detail_url')
              detail=json.loads((Path('site')/item['detail_url']).read_text('utf8'))
              assert detail['id']==item['id']
              for action in detail.get('institutions',[]):
                  assert action['evidence']['proof_type'] in ('exact_changed_article_cited_by_official_program', 'delegated_rule_and_operating_criterion', 'official_parent_subject_and_operating_value', 'explicit_named_standard_in_official_criteria')
                  assert action['evidence']['reference_quote']
                  assert action['evidence']['service_quote']
          print('PUBLISH_CONTRACT_PASS',catalog['summary'])
          PY
      - name: Store only incremental source versions and current public index
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name policy-domino-unified-bot
          git config user.email policy-domino-unified-bot@users.noreply.github.com
          git add data/ site/data.json site/events/ site/institutions.json
          if ! git diff --cached --quiet; then
            base_sha=$(git rev-parse HEAD)
            git fetch origin main
            remote_sha=$(git rev-parse FETCH_HEAD)
            if [ "$remote_sha" != "$base_sha" ]; then
              if git diff --name-only "$base_sha" "$remote_sha" -- data/ site/data.json site/events/ site/institutions.json | read -r changed; then
                echo "::error::Official evidence changed upstream; retained in recovery artifact."
                exit 1
              fi
            fi
            git commit -m 'data: refresh independent official evidence and public impact [skip ci]'
            if [ "$remote_sha" != "$base_sha" ]; then
              git rebase "$remote_sha"
            fi
            git push origin HEAD:main
          fi
      - name: Preserve collected evidence for recovery
        if: failure() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: collected-evidence-${{ github.run_id }}
          path: data/
          retention-days: 7
      - name: Configure Pages after repository owner has enabled it
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Upload one verified public site
        if: github.event_name != 'pull_request' && steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy unified source-backed site
        if: github.event_name != 'pull_request' && steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
      - name: Explain required one-time Pages setting if unavailable
        if: github.event_name != 'pull_request' && steps.pages.outcome != 'success'
        run: |
          echo "::warning::Source collection, comparison, impact and UI build succeeded. Pages needs manual enablement in repository Settings > Pages > Source: GitHub Actions."
          echo "Pages must first be enabled in repository Settings > Pages > Build and deployment > GitHub Actions." >> "$GITHUB_STEP_SUMMARY"

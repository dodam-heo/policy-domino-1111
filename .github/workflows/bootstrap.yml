name: Install verified Policy Domino workbench
on:
  push:
    branches: [main]
    paths: ['bootstrap/**', '.github/workflows/bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: policy-domino-unified-single-writer
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore canonical source and individual version files
        run: |
          python - <<'PY'
          from pathlib import Path
          import io, zipfile, shutil
          parts=sorted(Path('bootstrap').glob('*.part'))
          assert len(parts)==21, 'Incomplete transfer'
          with zipfile.ZipFile(io.BytesIO(b''.join(p.read_bytes() for p in parts))) as archive:
              assert archive.testzip() is None
              archive.extractall('.')
          shutil.rmtree('bootstrap')
          PY
      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check 'pypdf>=5,<7'
      - name: Verify source and evidence gates
        run: python -m unittest discover -s tests -v
      - name: Rebuild current institutional evidence and public index
        run: |
          python -m unified.impact --root data
          python -m unified.publish --root data --output site/data.json
      - name: Commit final source without transfer archive
        run: |
          git config user.name policy-domino-bot
          git config user.email policy-domino-bot@users.noreply.github.com
          git add -A
          git commit -m 'feat: install unified source, evidence store and policy workbench [skip ci]'
          git push origin HEAD:main
      - name: Configure public Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload public site
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy public site
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
      - name: Report one-time Pages setting
        if: steps.pages.outcome != 'success'
        run: echo '::warning::Enable Settings > Pages > Source > GitHub Actions to publish the verified site.'
